# The frontend's share of the stack. The backend repo contributes `api` and
# `db`; spec §6 requires the whole thing to come up with `docker compose up`
# and no manual setup beyond a documented .env.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-facing, so this is the address as seen from the HOST,
        # not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      # Server-side calls stay on the compose network.
      API_URL: ${API_URL:-http://api:4000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — see .env.example}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 15s
    restart: unless-stopped
